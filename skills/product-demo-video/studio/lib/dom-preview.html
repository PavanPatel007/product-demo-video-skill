<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#fff}</style>
<canvas id="c"></canvas>
<script src="motion.js"></script>
<script src="kit.js"></script>
<script>
// Fidelity check for capture-dom.mjs: screenshot | vector redraw | differences in red, and a score
// over content pixels only (an empty background would flatter any copy).
const Q = new URLSearchParams(location.search), S = 1;
const T = { shadow: 'rgba(0,0,0,0.2)', shadowBlur: 40 };
let g;
window.result = (async () => {
  await loadDom({ page: Q.get('dom') });
  const P = DOM.page;
  const ref = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('missing ' + Q.get('ref'))); i.src = Q.get('ref'); });
  const vec = document.createElement('canvas'); vec.width = P.w; vec.height = P.h;
  g = vec.getContext('2d'); domPage(P, 0, 0, P.w);
  // Half size forgives sub-pixel text placement and still catches a missing card, icon or word.
  const hw = Math.round(P.w / 2), hh = Math.round(P.h / 2);
  const half = (src) => {
    const cv = document.createElement('canvas'); cv.width = hw; cv.height = hh;
    const x = cv.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, hw, hh);
    return x.getImageData(0, 0, hw, hh).data;
  };
  const A = half(ref), B = half(vec);
  const probe = document.createElement('canvas').getContext('2d'); probe.fillStyle = P.bg; probe.fillRect(0, 0, 1, 1);
  const bgp = probe.getImageData(0, 0, 1, 1).data, luma = (d, i) => 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2], lb = luma(bgp, 0);
  const out = document.getElementById('c'); out.width = hw * 3 + 32; out.height = hh;
  const o = out.getContext('2d');
  o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height);
  o.drawImage(ref, 0, 0, hw, hh); o.drawImage(vec, hw + 16, 0, hw, hh);
  const D = o.createImageData(hw, hh);
  let content = 0, bad = 0;
  for (let i = 0; i < A.length; i += 4) {
    const a = luma(A, i), b = luma(B, i), miss = Math.abs(a - b) > 32;
    if (Math.abs(a - lb) > 16 || Math.abs(b - lb) > 16) content++;
    if (miss) bad++;
    const v = 200 + a * 0.2;
    D.data[i] = miss ? 230 : v; D.data[i + 1] = miss ? 40 : v; D.data[i + 2] = miss ? 40 : v; D.data[i + 3] = 255;
  }
  o.putImageData(D, hw * 2 + 32, 0);
  return { match: content ? 1 - bad / content : 1 };
})();
</script>
