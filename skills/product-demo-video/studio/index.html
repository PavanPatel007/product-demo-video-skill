<!doctype html>
<meta charset="utf-8">
<style>
/* Declare captured brand fonts here, e.g.
@font-face { font-family: 'Brand Sans'; src: url(assets/fonts/brand-sans.woff2) format('woff2'); font-weight: 100 900; } */
html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}
</style>
<canvas id="c"></canvas>
<script src="lib/motion.js"></script>
<script src="lib/kit.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080, DUR = 11;
const c = document.getElementById('c'); c.width = W; c.height = H;
const g = c.getContext('2d');
// Design space: the short side is always 1080 units, so one layout scales to any resolution.
const S = Math.min(W, H) / 1080, DW = W / S, DH = H / S;
const PORTRAIT = H > W * 1.1, SQUARE = !PORTRAIT && W < H * 1.1, WIDE = !PORTRAIT && !SQUARE;

// Beat grid: music.mjs starts on beat 0. For a supplied track set BPM and OFFSET from beats.json.
const BPM = 120, OFFSET = 0, BEAT = 60 / BPM;
const B = (n) => OFFSET + n * BEAT;
window.BPM = BPM; window.OFFSET = OFFSET;

// One timeline, several looks: render with --query theme=house
const THEMES = {
  brand: {   // fill from assets/brand.json (captured colors + fonts)
    bg: '#F4F3EF', fg: '#0B0B0A', muted: '#55524C', faint: '#A19D94', accent: '#FF4F1F', onAccent: '#FFFFFF',
    band: '#E9E6DF', panel: '#FFFFFF', shadow: 'rgba(20,18,14,0.16)', shadowBlur: 60,
    display: 'Inter, system-ui, sans-serif', dw: 800, track: -0.04, ui: 'Inter, system-ui, sans-serif', uw: 500,
    mono: 'ui-monospace, Menlo, monospace', mw: 500, mtrack: 0.12, grid: false, wordBand: false, cursor: '#0B0B0A',
  },
  house: {   // neutral dark look that works for any product
    bg: '#0E0E0D', fg: '#F2F0EA', muted: '#A8A59C', faint: '#5E5B55', accent: '#3DDC84', onAccent: '#0B0B0A',
    band: '#1F1E1B', panel: '#1A1917', shadow: 'rgba(0,0,0,0.65)', shadowBlur: 80,
    display: 'Inter, system-ui, sans-serif', dw: 800, track: -0.04, ui: 'Inter, system-ui, sans-serif', uw: 600,
    mono: 'ui-monospace, Menlo, monospace', mw: 600, mtrack: 0.14, grid: true, wordBand: false, cursor: '#FFFFFF',
  },
};
const T = THEMES[Q.get('theme')] || THEMES.brand;
const FONTS = ['800 40px Inter', '600 40px Inter', '500 40px Inter'];

// Real product assets only (captured into ./assets). Missing files fail the render loudly.
const ASSETS = {
  // logo: 'assets/logo.svg',
  // dash: 'assets/screens/app_dashboard.png',
};
const IMG = {};
window.ready = Promise.all([
  ...FONTS.map((f) => document.fonts.load(f)),
  ...Object.entries(ASSETS).map(([k, src]) => new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => { IMG[k] = i; res(); };
    i.onerror = () => rej(new Error('missing asset ' + src));
    i.src = src;
  })),
]).then(() => { IMG.dash ||= skeletonUI(); });

// Grey skeleton until real screenshots exist. Never ship it: replace with assets/screens/*.png.
function skeletonUI() {
  const cv = document.createElement('canvas'); cv.width = 1600; cv.height = 1000;
  const x = cv.getContext('2d'), r = rng(5);
  x.fillStyle = T.panel; x.fillRect(0, 0, 1600, 1000);
  x.fillStyle = T.band; x.fillRect(0, 0, 300, 1000); x.fillRect(300, 0, 1300, 90);
  for (let i = 0; i < 7; i++) { x.fillStyle = i === 1 ? T.accent : T.faint; x.globalAlpha = i === 1 ? 1 : 0.35; x.beginPath(); x.roundRect(40, 140 + i * 64, 160 + r() * 60, 22, 11); x.fill(); }
  x.globalAlpha = 1;
  for (let i = 0; i < 8; i++) {
    const y = 140 + i * 104;
    x.fillStyle = T.band; x.beginPath(); x.roundRect(350, y, 1200, 84, 16); x.fill();
    x.fillStyle = i % 3 ? T.faint : T.accent; x.beginPath(); x.arc(400, y + 42, 22, 0, Math.PI * 2); x.fill();
    x.fillStyle = T.faint; x.globalAlpha = 0.6; x.beginPath(); x.roundRect(450, y + 26, 220 + r() * 200, 16, 8); x.fill();
    x.globalAlpha = 0.3; x.beginPath(); x.roundRect(450, y + 52, 140 + r() * 260, 12, 6); x.fill(); x.globalAlpha = 1;
  }
  return cv;
}

// ---------- shots (one per row of docs/shotlist.md; times on the beat grid) ----------
const P = { x: DW / 2, y: DH / 2 };                         // where the opening pill sits
const PILL = { x: P.x - 300, y: P.y - 75, w: 600, h: 150, r: 75 };
const DOT = { x: P.x - 22, y: P.y - 22, w: 44, h: 44, r: 22 };
const TOG = WIDE ? { x: DW * 0.7, y: DH * 0.56 } : { x: DW * 0.5, y: DH * 0.7 };   // toggle the cursor flips

const SCENES = [
  { from: 0, to: B(5.5), draw(t) {                          // open: dot -> pill -> click -> flood
      const m = morphBox({ ...DOT, fill: T.accent }, { ...PILL, fill: T.fg }, sp(t - B(1), 'snappy'));
      const pop = clamp(sp(t, 'playful'), 0, 1.2), press = clamp(1 - Math.abs(t - B(3.5)) / 0.12);
      g.save(); g.translate(P.x, P.y); g.scale(pop * (1 - 0.05 * press), pop * (1 - 0.05 * press)); g.translate(-P.x, -P.y);
      alpha(1); rrect(m.x, m.y, m.w, m.h, m.r); g.fillStyle = m.fill; g.fill();
      rrect(m.x, m.y, m.w, m.h, m.r); g.clip();
      maskRise('Get started', P.x, P.y + 19, t - B(1.6), { size: 54, weight: 600, color: T.bg, align: 'center', font: fontU(54, 600) });
      g.restore();
      const cur = cursorPath(t, [[0, DW + 80, DH * 0.9], [B(2), P.x + 200, P.y + 160], [B(3), P.x + 70, P.y + 22]], [B(3.5)]);
      ripple(P.x + 70, P.y + 22, t - B(3.5));
      cursor(cur.x, cur.y, cur.press, clamp((t - B(2)) * 4));
      flood(P.x, P.y, sp(t - B(4), 'base') * 1.05, { color: T.fg });
  }},
  { from: B(4.5), to: B(15), draw(t) {                       // product: split headline + live UI in 3D, camera push
      const lt = t - B(5);                                    // local time from the reveal
      if (lt < 0) { alpha(1); g.fillStyle = T.fg; g.fillRect(0, 0, DW, DH); return; }
      background();
      // collapse to the accent dot (handoff to the end card) on beat 14.5
      const k = 1 - sp(t - B(14.5), 'base');
      g.save(); g.translate(TOG.x, TOG.y); g.scale(Math.max(0.001, k), Math.max(0.001, k)); g.translate(-TOG.x, -TOG.y);

      const z = track(t, [[B(5), 0.94], [B(6), 1], [B(10), 1.55]], 120, 24);
      const fx = track(t, [[B(5), DW / 2], [B(10), TOG.x]], 120, 24), fy = track(t, [[B(5), DH / 2], [B(10), TOG.y]], 120, 24);
      g.save(); camera(z, fx, fy);
      const ui = WIDE ? { x: DW * 0.71, y: DH * 0.55, w: 1180 } : { x: DW * 0.52, y: DH * 0.64, w: DW * 1.05 };
      const rise = sp(lt - 0.1, 'heavy');
      plane3d(IMG.dash, ui.x, ui.y + (1 - rise) * DH * 0.6, ui.w, {
        ry: track(t, [[B(5), WIDE ? -24 : 0], [B(10), 0]], 120, 24), rx: track(t, [[B(5), 16], [B(10), 0]], 120, 24),
        rz: track(t, [[B(5), -3], [B(10), 0]], 120, 24), blur: 3 * clamp((t - B(10)) / 0.5) });
      // live number on the UI
      if (t > B(8)) {
        const cs = sp(t - B(8), 'snappy'), cx0 = ui.x - (WIDE ? 420 : 160), cy0 = ui.y - (WIDE ? 300 : 360);
        g.save(); g.translate(cx0, cy0); g.scale(clamp(cs, 0, 1.1), clamp(cs, 0, 1.1));
        card(-170, -64, 340, 128, { r: 22 });
        countUp(0, 12480, -136, 14, t - B(8.4), { size: 52, dur: 1.2 });
        label('Leads synced', -136, 48, t - B(8.6), { size: 16, color: T.muted });
        g.restore();
      }
      // the action the cursor performs, in focus while the UI behind goes soft
      const ts = sp(t - B(10.5), 'snappy');
      if (ts > 0) {
        g.save(); g.translate(TOG.x, TOG.y); g.scale(clamp(ts, 0, 1.1), clamp(ts, 0, 1.1));
        card(-210, -58, 420, 116, { r: 26 });
        g.font = fontU(30, 600); g.fillStyle = T.fg; g.textBaseline = 'middle'; alpha(1); g.fillText('Auto-reply', -176, 2);
        toggle(64, -25, sp(t - B(12), 'snappy'));
        g.restore();
      }
      // the result lands on the next beat, so the click never sits still
      const rs = sp(t - B(13), 'snappy');
      if (rs > 0) {
        g.save(); g.translate(TOG.x, TOG.y + 118); g.scale(clamp(rs, 0, 1.1), clamp(rs, 0, 1.1));
        g.font = fontU(30, 600); const cw = g.measureText('✓  Replied in 2 s').width + 60 * 0.8;
        chip('✓  Replied in 2 s', -cw / 2, -30, { size: 30, h: 60, fill: T.fg, color: T.bg });
        g.restore();
      }
      const cur = cursorPath(t, [[B(10), TOG.x + 260, TOG.y + 220], [B(11.4), TOG.x + 128, TOG.y + 6], [B(12.6), TOG.x + 210, TOG.y + 150]], [B(12)]);
      ripple(TOG.x + 128, TOG.y + 6, t - B(12));
      cursor(cur.x, cur.y, cur.press, clamp((t - B(10.2)) * 4) * clamp((B(14.5) - t) * 4));
      g.restore();

      // headline, outside the camera so it stays crisp; letters leave through the same mask line
      const hx = WIDE ? 120 : 80, hy = WIDE ? DH * 0.42 : DH * 0.2, hs = WIDE ? 120 : 112;
      scramble('INBOX / LIVE', hx, hy - hs * 1.25, lt - 0.05, { size: 20, color: T.muted, dur: 0.5, out: B(9.5) - B(5) });
      const l1 = B(5) + 0.2, l2 = B(5) + 0.45;               // line starts; both leave on beat 9.5
      maskRise('Every lead.', hx, hy, t - l1, { size: hs, out: B(9.5) - l1, accentLast: true });
      maskRise('One inbox.', hx, hy + hs * 1.02, t - l2, { size: hs, out: B(9.6) - l2, accentLast: true });
      g.restore();
      contract(P.x, P.y, sp(lt, 'base') * 1.05, { color: T.fg });   // the flood opens onto this scene
      if (k < 0.999) { alpha(1); g.fillStyle = T.accent; g.beginPath(); g.arc(TOG.x, TOG.y, 16 * (1 - k) + 8, 0, Math.PI * 2); g.fill(); }
  }},
  { from: B(15), to: DUR, draw(t) {                          // end card: dot travels into the wordmark's period
      const size = PORTRAIT ? 150 : 170, cy = DH / 2 - (PORTRAIT ? 80 : 60);
      g.save(); g.font = fontD(size, 800); g.letterSpacing = `${size * T.track}px`;
      const ww = g.measureText('Product').width; g.restore();
      const dotX = DW / 2 - size * 0.12 + ww / 2 + size * 0.17, dotY = cy + size * 0.35 - size * 0.11;
      maskRise('Product', DW / 2 - size * 0.12, cy + size * 0.35, t - B(16), { size, weight: 800, align: 'center', stagger: 0.035 });
      const dx = track(t, [[B(15), TOG.x], [B(15.5), dotX]], 170, 26), dy = track(t, [[B(15), TOG.y], [B(15.5), dotY]], 170, 26);
      const dr = track(t, [[B(15), 24], [B(16.5), size * 0.11]], 170, 26);
      alpha(1); g.fillStyle = T.accent; g.beginPath(); g.arc(dx, dy, dr, 0, Math.PI * 2); g.fill();
      const b = sp(t - B(18), 'snappy');
      if (b > 0) pill('Try it free', DW / 2, cy + size + 40, b, { size: 32, h: 84, padX: 52, fill: T.fg, color: T.bg });
      typeOn('product.com', DW / 2 - 92, cy + size + 150, t - B(19), { size: 28, color: T.muted, font: fontM(28) });
      if (Q.has('mascot')) {
        const hop = t - B(20), y = DH / 2 + (PORTRAIT ? 420 : 300) - 140 * Math.max(0, Math.sin(Math.PI * clamp(hop / 0.5)));
        const land = clamp(1 - Math.abs(hop - 0.5) / 0.12);
        if (hop > 0) mascot(DW / 2 - (PORTRAIT ? 260 : 420), y, 110, t, { squash: land * 0.8 - (hop < 0.5 ? 0.3 : 0), look: [1, -0.3] });
      }
  }},
];

function background() {
  alpha(1); g.fillStyle = T.bg; g.fillRect(0, 0, DW, DH);
  if (T.grid) {
    g.fillStyle = 'rgba(255,255,255,0.045)';
    for (let x = 40; x < DW; x += 48) for (let y = 30; y < DH; y += 48) g.fillRect(x, y, 2, 2);
  }
}

function draw(t) {
  g.setTransform(S, 0, 0, S, 0, 0); g.filter = 'none';
  SA = 1; g.globalAlpha = 1;
  background();
  for (const s of SCENES) if (t >= s.from && t < s.to) {
    SA = 1; g.globalAlpha = 1;
    g.save(); s.draw(t); g.restore();
  }
}
window.DUR = DUR;
window.seek = (t) => { draw(t); return true; };

// Live preview in a normal browser; off during headless render.
if (!navigator.webdriver) {
  window.ready.then(() => {
    const t0 = performance.now();
    (function loop() { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })();
  });
}
</script>
