name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill zip (folder at the root, as Claude.ai and other skill uploaders expect)
        run: cd skills && zip -rq ../product-demo-video.zip product-demo-video -x '*.DS_Store'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" product-demo-video.zip --clobber \
            || gh release create "$GITHUB_REF_NAME" product-demo-video.zip --title "$GITHUB_REF_NAME" --generate-notes
