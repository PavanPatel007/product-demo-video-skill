<!doctype html>
<meta charset="utf-8">
<title>Fixture app</title>
<style>
@font-face { font-family: 'Fixture Sans'; src: url(brand.ttf) format('truetype'); font-weight: 400 700; }
* { box-sizing: border-box }
body { margin: 0; font: 15px 'Fixture Sans', sans-serif; color: #18181b; background: #f4f4f5; display: flex; height: 100vh }
nav { width: 240px; background: #18181b; color: #a1a1aa; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px }
nav img { width: 120px; margin-bottom: 24px }
nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: inherit; text-decoration: none }
nav a.on { background: #27272a; color: #fafafa }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2 }
main { flex: 1; padding: 28px 36px; overflow: hidden; display: flex; flex-direction: column; gap: 20px }
header { display: flex; justify-content: space-between; align-items: center }
h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em }
input { width: 280px; padding: 10px 14px; border: 1px solid #d4d4d8; border-radius: 10px; font: inherit; background: #fff }
.banner { padding: 18px 22px; border-radius: 14px; color: #fff; font-weight: 700; background: linear-gradient(90deg, #ff4f1f, #ff8a3d) }
.row { display: flex; gap: 20px }
.card { flex: 1; background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06) }
.card b { display: block; font-size: 30px; margin-top: 6px }
.badge { display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 12px; font-weight: 700; text-transform: uppercase }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden }
td { padding: 12px 18px; border-bottom: 1px solid #e4e4e7 }
.photo { width: 160px; height: 90px; border-radius: 12px; object-fit: cover }
</style>
<nav>
  <img src="logo.svg" alt="Fixture logo">
  <a class="on" href="#"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>Dashboard</a>
  <a href="#"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Reports</a>
  <a href="#"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Leads</a>
</nav>
<main>
  <header><h1>Monthly revenue</h1><input placeholder="Search leads"></header>
  <div class="banner">3 new leads need a reply</div>
  <div class="row">
    <div class="card">Revenue<b>$48,210</b><span class="badge">up 12%</span></div>
    <div class="card">Open deals<b>126</b></div>
    <div class="card">Chart<br><canvas id="chart" width="240" height="70"></canvas></div>
  </div>
  <table>
    <tr><td>Acme Corp</td><td>Qualified</td><td>$12,000</td></tr>
    <tr><td>Globex</td><td>New</td><td>$4,500</td></tr>
    <tr><td><img class="photo" src="photo.png" alt=""></td><td>Initech</td><td>$9,800</td></tr>
  </table>
</main>
<script>
const x = document.getElementById('chart').getContext('2d');
x.strokeStyle = '#ff4f1f'; x.lineWidth = 3; x.beginPath();
[10, 40, 25, 55, 35, 60, 50].forEach((v, i) => x.lineTo(i * 38 + 4, 66 - v));
x.stroke();
</script>
